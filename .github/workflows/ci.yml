name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 25
      uses: actions/setup-java@v3
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Run Tests
      run: mvn test

    - name: Audit Vulnerabilities
      uses: docker/scout-action@v1
      with:
        command: cves
        image: job-search-mcp-server:v7
        # Only block / fail your pipeline on actionable, fixable application flaws
        exit-code: true
        only-severities: critical,high
        